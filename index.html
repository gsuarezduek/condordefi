<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal privado</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0f0f0e;
    --panel:#17171533;
    --card:#ffffff;
    --gold:#e9b73e;
    --gold-dark:#c99a2b;
    --text-dim:#9a9a9a;
    --border:#e4e0d4;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #232320 0%, #0f0f0e 55%);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:34px;
  }
  .logo{
    width:min(320px, 70vw);
    height:auto;
    display:block;
  }
  .card{
    width:100%;
    background:var(--card);
    border-radius:16px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.04) inset;
    padding:30px 30px 26px 30px;
  }
  .tabs{
    display:flex;
    background:#f3f1ea;
    border-radius:10px;
    padding:4px;
    margin-bottom:22px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 0;
    font-size:13.5px;
    font-weight:600;
    color:#7a7a7a;
    border-radius:8px;
    cursor:pointer;
    user-select:none;
    transition:all .15s ease;
  }
  .tab.active{
    background:#161615;
    color:#fff;
  }
  h1{
    font-size:15px;
    margin:0 0 4px 0;
    color:#161615;
    font-weight:700;
  }
  .sub{
    font-size:12.5px;
    color:#8a8a8a;
    margin:0 0 20px 0;
  }
  form{display:flex;flex-direction:column;gap:12px;}
  label{
    font-size:11.5px;
    font-weight:600;
    color:#5a5a5a;
    letter-spacing:.2px;
    margin-bottom:5px;
    display:block;
  }
  input[type=email],
  input[type=password],
  input[type=text]{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    color:#1c1c1c;
    background:#fcfbf8;
    outline:none;
    transition:border-color .15s ease;
  }
  input:focus{border-color:var(--gold-dark);}
  .field{margin-bottom:2px;}
  .btn{
    width:100%;
    padding:12px 0;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:filter .15s ease, transform .05s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:var(--gold);
    color:#1c1500;
    margin-top:6px;
  }
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:18px 0;
    color:#b7b3a4;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .divider::before,.divider::after{
    content:'';
    flex:1;
    height:1px;
    background:#e9e6db;
  }
  .btn-google{
    background:#fff;
    border:1px solid var(--border);
    color:#2b2b2b;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .btn-google:hover{background:#faf9f6;}
  .btn-google svg{width:18px;height:18px;}
  .msg{
    font-size:12.5px;
    border-radius:8px;
    padding:10px 12px;
    margin-top:14px;
    display:none;
  }
  .msg.error{background:#fdeceb;color:#a5322a;display:block;}
  .msg.ok{background:#ecf6ee;color:#276a3d;display:block;}
  .forgot{
    text-align:right;
    margin-top:-2px;
  }
  .forgot a{
    font-size:11.5px;
    color:#8a8a8a;
    text-decoration:none;
  }
  .forgot a:hover{color:#5a5a5a;text-decoration:underline;}
  .footer-note{
    font-size:10.5px;
    color:#5a5a58;
    text-align:center;
    line-height:1.5;
  }
  .footer-note a{color:#8f7328;text-decoration:none;}
  .hidden{display:none !important;}
  .spinner{
    width:14px;height:14px;
    border:2px solid rgba(0,0,0,.15);
    border-top-color:#1c1500;
    border-radius:50%;
    display:inline-block;
    animation:spin .7s linear infinite;
    vertical-align:-2px;
    margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

        </button>

        <div class="divider">o</div>

        <form id="login-form">
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" required autocomplete="current-password">
          </div>
          <div class="forgot"><a href="#" id="forgot-link">¿Olvidaste tu contraseña?</a></div>
          <button type="submit" class="btn btn-primary" id="login-submit">Iniciar sesión</button>
        </form>

        <div class="msg" id="login-msg"></div>
      </div>

      <!-- SIGNUP -->
      <div id="panel-signup" class="hidden">
        <h1>Crear cuenta</h1>
        <p class="sub">Acceso solo por invitación.</p>

        <button type="button" class="btn btn-google" id="google-signup-btn">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4c-7.6 0-14.1 4.3-17.4 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.5C29.6 35 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8l-6.6 5.1C9.8 39.6 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4 5.5l6.6 5.5C40.9 36.6 44 30.9 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
          Continuar con Google
        </button>

        <div class="divider">o</div>

        <form id="signup-form">
          <div class="field">
            <label for="signup-name">Nombre</label>
            <input type="text" id="signup-name" required autocomplete="name">
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="signup-password">Contraseña</label>
            <input type="password" id="signup-password" required minlength="8" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary" id="signup-submit">Crear cuenta</button>
        </form>

        <div class="msg" id="signup-msg"></div>
      </div>
    </div>

    <p class="footer-note">Acceso privado y restringido.<br>© <span id="year"></span> — Todos los derechos reservados.</p>
  </div>

  <!-- Firebase (Auth) — reemplazá con tu propio proyecto -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      updateProfile,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    // ⚠️ CONFIGURACIÓN: pegá acá las credenciales de TU proyecto de Firebase
    // (Firebase Console → Configuración del proyecto → Tus apps → SDK config)
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      projectId: "TU_PROYECTO",
      storageBucket: "TU_PROYECTO.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // A dónde redirigir después de un login exitoso.
    const REDIRECT_URL = "app.html";

    // Si ya hay sesión activa, saltar directo al panel.
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.replace(REDIRECT_URL);
    });

    document.getElementById("year").textContent = new Date().getFullYear();

    // --- Tabs ---
    const tabs = document.querySelectorAll(".tab");
    const panels = { login: document.getElementById("panel-login"), signup: document.getElementById("panel-signup") };
    tabs.forEach(t => t.addEventListener("click", () => {
      tabs.forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      Object.values(panels).forEach(p => p.classList.add("hidden"));
      panels[t.dataset.tab].classList.remove("hidden");
    }));

    function showMsg(el, text, ok = false) {
      el.textContent = text;
      el.className = "msg " + (ok ? "ok" : "error");
    }

    function friendlyError(err) {
      const map = {
        "auth/invalid-email": "El email no es válido.",
        "auth/user-disabled": "Esta cuenta está deshabilitada.",
        "auth/user-not-found": "No existe una cuenta con ese email.",
        "auth/wrong-password": "Contraseña incorrecta.",
        "auth/invalid-credential": "Email o contraseña incorrectos.",
        "auth/email-already-in-use": "Ya existe una cuenta con ese email.",
        "auth/weak-password": "La contraseña debe tener al menos 8 caracteres.",
        "auth/popup-closed-by-user": "Ventana cerrada antes de completar el inicio de sesión.",
      };
      return map[err.code] || "Ocurrió un error. Intentá de nuevo.";
    }

    // --- Google ---
    async function withGoogle() {
      try {
        await signInWithPopup(auth, provider);
        window.location.replace(REDIRECT_URL);
      } catch (err) {
        console.error(err);
        showMsg(document.getElementById("login-msg"), friendlyError(err));
      }
    }
    document.getElementById("google-login-btn").addEventListener("click", withGoogle);
    document.getElementById("google-signup-btn").addEventListener("click", withGoogle);

    // --- Login ---
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("login-submit");
      const msg = document.getElementById("login-msg");
      msg.style.display = "none";
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Ingresando…';
      try {
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;
        await signInWithEmailAndPassword(auth, email, password);
        window.location.replace(REDIRECT_URL);
      } catch (err) {
        console.error(err);
        showMsg(msg, friendlyError(err));
      } finally {
        btn.disabled = false;
        btn.textContent = "Iniciar sesión";
      }
    });

    // --- Forgot password ---
    document.getElementById("forgot-link").addEventListener("click", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("login-msg");
      const email = document.getElementById("login-email").value.trim();
      if (!email) {
        showMsg(msg, "Ingresá tu email arriba y volvé a tocar el enlace.");
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        showMsg(msg, "Te enviamos un email para restablecer tu contraseña.", true);
      } catch (err) {
        console.error(err);
        showMsg(msg, friendlyError(err));
      }
    });

    // --- Signup ---
    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("signup-submit");
      const msg = document.getElementById("signup-msg");
      msg.style.display = "none";
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Creando cuenta…';
      try {
        const name = document.getElementById("signup-name").value.trim();
        const email = document.getElementById("signup-email").value.trim();
        const password = document.getElementById("signup-password").value;
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        if (name) await updateProfile(cred.user, { displayName: name });
        window.location.replace(REDIRECT_URL);
      } catch (err) {
        console.error(err);
        showMsg(msg, friendlyError(err));
      } finally {
        btn.disabled = false;
        btn.textContent = "Crear cuenta";
      }
    });
  </script>
</body>
</html>
